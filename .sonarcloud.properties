# Read by SonarCloud Automatic Analysis
sonar.sources=.
sonar.tests=tests
sonar.exclusions=vendor/**,languages/**

# php:S2003 asks for include_once, but these includes are HTML templates that must
# render again for every [avpvh_filelist] shortcode on a page. include_once would blank them.
sonar.issue.ignore.multicriteria=templates,fnname,classname,fieldname
sonar.issue.ignore.multicriteria.templates.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.templates.resourceKey=includes/**/*.php

# Sonar's naming rules (functions, classes, fields) only accept PSR names; the code follows
# WordPress naming (avpvh_filelist_*), which grmt/wp-plugin-ci checks instead. As in avpvh-members.
sonar.issue.ignore.multicriteria.fnname.ruleKey=php:S100
sonar.issue.ignore.multicriteria.fnname.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.classname.ruleKey=php:S101
sonar.issue.ignore.multicriteria.classname.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.fieldname.ruleKey=php:S116
sonar.issue.ignore.multicriteria.fieldname.resourceKey=**/*.php
