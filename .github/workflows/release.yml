name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v6.3.13-grmt.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/CI.yml
    permissions:
      contents: read

  release:
    name: Build & Publish Plugin ZIP
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Determine tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z.+_-]+$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # CI's build is the git archive of this commit, so the ZIP holds
      # exactly what CI checked.
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact
          path: simple-file-list

      - name: Package simple-file-list.zip
        run: |
          zip -r -q "$GITHUB_WORKSPACE/simple-file-list.zip" simple-file-list
          ls -lh simple-file-list.zip

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" simple-file-list.zip --clobber
          else
            gh release create "$TAG" simple-file-list.zip \
              --title "Simple File List ${VERSION}" \
              --generate-notes
          fi
