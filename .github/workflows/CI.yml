name: "CI"
on:
  push:
    # "*" only matches single-segment branch names (no "/"); "**" also
    # covers "fix/..."-style branches.
    branches: "**"
  pull_request:
  # The release workflow runs CI and zips its build.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # git archive honours export-ignore in .gitattributes, so this holds
      # exactly what the release ZIP holds: no tests, tooling or CI files.
      - name: "Package what a release ships"
        run: |
          mkdir build
          git archive HEAD | tar -x -C build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: build

  # Shared with the other own plugins: syntax on 8.4 and 8.5,
  # PHPCompatibility and the WordPress.org Plugin Check on the build.
  plugin-checks:
    name: "Shared"
    needs: build
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: simple-file-list
      artifact: build-artifact
      # outdated_tested_upto_header and plugin_updater_detected: the plugin is
      # not on WordPress.org; it updates from GitHub Releases (Update URI).
      ignore-codes: |
        outdated_tested_upto_header
        plugin_updater_detected

  # The checks below are this plugin's own.
  phpcs:
    name: "WordPress coding standards"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.4"
          coverage: none
          tools: cs2pr

      - name: "Install Composer dependencies"
        run: composer install -n --prefer-dist --no-progress

      - name: "PHPCS (WordPress security, API and PHP compatibility)"
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr --graceful-warnings

  test:
    name: "Unit tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}

      - name: "Install Composer dependencies"
        run: composer install -n --prefer-dist --no-progress

      - name: "PHPUnit"
        run: vendor/bin/phpunit ${{ matrix.php == '8.4' && '--coverage-text' || '' }}

  integration:
    name: "Integration tests (WordPress, PHP 8.4, LDAP)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Start WordPress and OpenLDAP, run the HTTP tests"
        run: tests/integration/run.sh
